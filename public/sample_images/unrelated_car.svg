<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#f1f5f9"/>
  <!-- Sky / Background -->
  <rect x="0" y="0" width="400" height="200" fill="#e2e8f0"/>
  <!-- Road -->
  <rect x="0" y="200" width="400" height="100" fill="#475569"/>
  <line x1="20" y1="250" x2="100" y2="250" stroke="#f8fafc" stroke-width="6" stroke-dasharray="20,15"/>
  <line x1="140" y1="250" x2="260" y2="250" stroke="#f8fafc" stroke-width="6" stroke-dasharray="20,15"/>
  <line x1="300" y1="250" x2="380" y2="250" stroke="#f8fafc" stroke-width="6" stroke-dasharray="20,15"/>
  <!-- Car Body -->
  <path d="M 60 190 L 100 130 L 250 130 L 310 170 L 340 175 L 340 210 L 60 210 Z" fill="#ef4444"/>
  <!-- Roof / Cabin -->
  <path d="M 110 135 L 140 85 L 230 85 L 265 135 Z" fill="#b91c1c"/>
  <!-- Windows -->
  <polygon points="142,90 200,90 200,130 118,130" fill="#bae6fd"/>
  <polygon points="208,90 228,90 258,130 208,130" fill="#bae6fd"/>
  <!-- Wheels -->
  <circle cx="120" cy="210" r="28" fill="#1e293b"/>
  <circle cx="120" cy="210" r="14" fill="#94a3b8"/>
  <circle cx="280" cy="210" r="28" fill="#1e293b"/>
  <circle cx="280" cy="210" r="14" fill="#94a3b8"/>
  <!-- Headlight -->
  <polygon points="335,178 340,178 338,195 330,195" fill="#fef08a"/>
  <!-- Banner -->
  <rect x="50" y="25" width="300" height="38" rx="8" fill="#1e293b" opacity="0.9"/>
  <text x="200" y="49" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Unrelated Subject: Motor Vehicle (Car)</text>
</svg>

